<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>植物｜多語言對照表</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;background:#eff8f1;color:#1f3d2b;padding:16px}
a{text-decoration:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:26px;text-align:center;margin:10px 0 4px;color:#1f6b3a}
.sub{text-align:center;color:#6b8a77;font-size:13px;margin-bottom:18px}
h2{font-size:16px;color:#2e7d32;margin:22px 0 10px;padding-left:10px;border-left:5px solid #43a047}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:14px 12px;box-shadow:0 2px 6px rgba(30,90,50,.10);
      transition:transform .12s,box-shadow .12s;display:block;text-align:center;border:1px solid #e2f0e6}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(30,90,50,.20);border-color:#a5d6a7}
.card .ico{font-size:34px;line-height:1;margin-bottom:8px}
.card .n{font-size:16px;font-weight:600;color:#20503a}
.card .c{font-size:11px;color:#8aa79a;margin-top:5px}
.back{display:inline-block;margin-bottom:12px;color:#2e7d32;font-size:14px}
.tablewrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(30,90,50,.12);overflow:auto;max-height:80vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{background:#2e7d32;color:#fff;padding:10px 16px;font-size:13px;position:sticky;top:0;z-index:5;white-space:nowrap}
th.cat{font-size:13px;font-weight:700;letter-spacing:2px;top:0;z-index:6}
th.lang{background:#43a047;font-size:13px;top:36px;z-index:5}
th.sub{background:#66bb6a;font-size:11px;font-weight:400;top:72px;z-index:5}
td{padding:8px 16px;border-bottom:1px solid #eaf4ec;text-align:center;vertical-align:middle;background:#fff;white-space:nowrap}
tr:nth-child(even) td{background:#f7fcf8}
td.group{border-right:1px solid #edf7ef;position:relative;z-index:0}
/* 語言之間的粗分隔線 */
.gsep{border-left:3px solid #a5d6a7!important}
th.gsep{border-left:3px solid #14532d!important}
td.first{border-right:3px solid #a5d6a7}
/* 凍結：繁體中文「寫法」欄緊跟圖片欄固定不動 */
td.zcol{position:sticky;left:104px;background:#e8f5e9!important;font-weight:600;box-shadow:2px 0 5px rgba(30,90,50,.08);z-index:4}
/* 凍結：左邊第一欄（圖片＋詞）不動 */
td.first,th:first-child{position:sticky;left:0;padding-left:10px;padding-right:10px;box-shadow:2px 0 5px rgba(30,90,50,.08)}
td.first{background:#e8f5e9!important;font-weight:600;min-width:104px;z-index:5}
thead th:first-child{z-index:8;background:#2e7d32;color:#fff;text-align:center}
.tablewrap{isolation:isolate}
/* 圖片欄（凍結） */
.imgcol{width:104px;min-width:104px;padding:4px!important}
.thumb{display:inline-flex;align-items:center;justify-content:center;width:86px;height:86px;
       background:#f4faf5;border-radius:10px;border:1px dashed #cde3d3;overflow:hidden}
.thumb.has{border:none;background:transparent}
.thumb img{width:86px;height:86px;object-fit:contain;display:block;background:transparent}
.phon{color:#7f9c8b;font-size:12px;display:block;white-space:nowrap}
.word{white-space:nowrap}
.spk{border:none;background:#43a047;color:#fff;width:24px;height:24px;border-radius:50%;
     cursor:pointer;font-size:11px;margin-left:4px;vertical-align:middle}
.spk:hover{background:#2e7d32}
.spk.playing{background:#ef6c00}
.spk.no{-webkit-filter:grayscale(1);opacity:.45}
.status{text-align:center;padding:30px;color:#8aa79a}
.err{color:#c62828}
.note{font-size:12px;color:#8aa79a;margin:10px 4px}
/* 右上角語言切換（中華語言／常見語言） */
#catbar{position:fixed;top:10px;right:10px;z-index:60;display:flex;gap:6px;align-items:center;
        background:#fff;border:1px solid #cde3d3;border-radius:999px;padding:5px 9px;
        box-shadow:0 3px 12px rgba(30,90,50,.18)}
#catbar:empty{display:none}
#catbar span{font-size:11px;color:#8aa79b}
#catbar button{border:none;background:#e8f5e9;color:#20503a;font-size:12px;padding:6px 11px;
        border-radius:999px;cursor:pointer;white-space:nowrap}
#catbar button.on{background:#2e7d32;color:#fff}
body[data-mode="cat1"] .cc.cat2,body[data-mode="cat1"] .cc.cat3{display:none}
body[data-mode="cat2"] .cc.cat1,body[data-mode="cat2"] .cc.cat3{display:none}
body[data-mode="cat3"] .cc.cat1,body[data-mode="cat3"] .cc.cat2{display:none}
@media(max-width:520px){#catbar{top:auto;bottom:10px;right:10px}}
</style></head>
<body><div class="wrap"><a class="back" href="../index.html">← 回多語言對照表</a><h1>🌱 植物</h1><div class="sub">點 🔊 聽發音 · 台語／客語若系統沒語音會用拼音朗讀 · 表格可左右滑：<b>圖片＋繁體中文固定</b>不動<br>語言分三類：<b>繁體中文</b>｜<b>中華語言</b>（簡體中文·台語·客語）｜<b>常見語言</b>（美式英文·英式英文·日文·韓文）· <b>右上角可切換</b></div><div id="catbar"></div><div id="box"><div class="status">載入中…</div></div><div class="note">資料來源：原本的 Google 試算表（即時讀取）</div></div><script>
function setMode(m){
  document.body.setAttribute('data-mode',m);
  document.querySelectorAll('#catbar button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-m')===m);});
  try{localStorage.setItem('langmode',m);}catch(e){}
}
const VOICE_MAP={
 '繁體中文':{lang:'zh-TW'},'簡體中文':{lang:'zh-CN'},
 '台語':{lang:'nan-TW',fallback:'zh-TW',usePhon:1},
 '客語':{lang:'hak-TW',fallback:'zh-TW',usePhon:1},
 '美式英文':{lang:'en-US'},'英式英文':{lang:'en-GB'},
 '日文':{lang:'ja-JP'},'韓文':{lang:'ko-KR'}
};
let voices=[];function lv(){voices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=lv;lv();
function hasVoice(l){return voices.some(v=>v.lang.toLowerCase().startsWith(l.split('-')[0].toLowerCase()));}
function spk(btn){
  const au=btn.getAttribute('data-audio');
  document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');setTimeout(()=>btn.classList.remove('playing'),1500);
  speechSynthesis.cancel();
  if(au){try{new Audio(au).play();}catch(e){}return;}   // 有現成音檔優先
  const nm=btn.getAttribute('data-name'),txt=btn.getAttribute('data-text'),ph=btn.getAttribute('data-phon');
  const cfg=VOICE_MAP[nm];if(!cfg||!txt)return;
  let lang=cfg.lang,t=txt;
  if(!hasVoice(cfg.lang)){
    if(cfg.usePhon&&ph){t=ph;lang=cfg.fallback||cfg.lang;}
    else if(cfg.fallback){lang=cfg.fallback;}
  }
  const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;
  speechSynthesis.speak(u);
}

const SHEET='1R51TqXVBBAWFNpSLZJnXOMQf8wnffkqk37CggrXO9WM',TOPIC='植物';
const IMGBASE='../img/',AUDIOBASE='../audio/';
const box=document.getElementById('box');
let AUDIO_MAP={},IMG_MAP={};
function fillMedia(){
  // 圖片欄
  document.querySelectorAll('.thumb').forEach(el=>{
    if(el.classList.contains('has'))return;
    const w=el.getAttribute('data-word'),i=el.getAttribute('data-i');
    const src=IMG_MAP[w]||IMG_MAP['#'+i];
    if(src){el.classList.add('has');el.innerHTML='<img loading="lazy" src="../'+src+'" alt="'+w+'">';}
  });
  // 各語音檔：有檔就用檔播（任何裝置都一定聽得到）
  document.querySelectorAll('.spk').forEach(b=>{
    if(b.getAttribute('data-audio'))return;
    const nm=b.getAttribute('data-name');
    const L=(AUDIO_MAP[nm]||{})[TOPIC]||{};if(!L)return;
    const tr=b.closest('tr'),first=tr?tr.querySelector('td.first'):null,th=first?first.querySelector('.thumb'):null;
    if(!th)return;
    const w=th.getAttribute('data-word'),i=th.getAttribute('data-i');
    const src=L[w]||L['#'+i];
    if(src){b.setAttribute('data-audio','../'+src);}
  });
}
// 先抓音檔清單＋圖片清單
Promise.all([
  fetch(AUDIOBASE+'manifest.json?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch(IMGBASE+'manifest.json?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))
]).then(([aud,img])=>{
  AUDIO_MAP=aud||{};
  IMG_MAP=(img&&img[TOPIC])||{};
  fillMedia();
});
function clean(v){return v==null?'':String(v).replace(/\r/g,'').split('\n')[0].trim();}
function cleanFull(v){return v==null?'':String(v).replace(/\r/g,'');}
fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:json')
 .then(r=>r.text()).then(t=>{
   const j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
   const tb=j.table;
   const raw=tb.rows.map(r=>r.c.map(c=>c?(c.f!=null?String(c.f):(c.v==null?'':String(c.v))):''));
   const hdr=raw[0]||[],sub=raw[1]||[],data=raw.slice(2);
   // 依 row0 非空切出語言群組
   const groups=[];let cur=null;
   hdr.forEach((v,i)=>{if(clean(v)){cur={name:clean(v),start:i,cols:[]};groups.push(cur);} if(cur)cur.cols.push(i);});
   // 只留真正的語言群組：把「圖示」拿掉、每組最多 3 欄、全空的組丢掉
   const LANG=groups.filter(g=>g.name!=='圖示');
   LANG.forEach((g,k)=>{
     const next=LANG[k+1];
     const end=Math.min(next?next.start:hdr.length, g.start+3);
     g.cols=[];for(let i=g.start;i<end;i++)g.cols.push(i);
   });
   let use=LANG.filter(g=>g.cols.some(c=>clean(sub[c])||data.some(r=>clean(r[c]))));
   const first=groups.length?groups[0]:null;   // 第一欄 = 圖示欄
   const iconCol=(first&&clean(hdr[first.start])==='圖示')?first.start:0;
   // ── 語言分類：繁體中文固定（置頂）；中華語言＝簡體·台語·客語；常見語言＝英·日·韓 ──
   const CATS=[['繁體中文',['繁體中文']],
               ['中華語言',['簡體中文','台語','客語']],
               ['常見語言',['美式英文','英式英文','日文','韓文']]];
   const byName={};use.forEach(g=>{byName[g.name]=g;});
   const CAT=[],taken={};
   CATS.forEach(c=>{
     const langs=c[1].map(n=>byName[n]).filter(Boolean);
     if(langs.length){langs.forEach(g=>{taken[g.name]=1;});CAT.push({name:c[0],langs:langs});}
   });
   const other=use.filter(g=>!taken[g.name]);
   if(other.length)CAT.push({name:'其他語言',langs:other});
   use=[];CAT.forEach(c=>{c.langs.forEach(g=>{use.push(g);});});
   const CAT_BG={'繁體中文':'#1b5e20','中華語言':'#2e7d32','常見語言':'#388e3c','其他語言':'#546e7a'};
   let h='<thead><tr><th class="imgcol" rowspan="3">圖片</th>';
   CAT.forEach((c,ci)=>{
     let span=0;c.langs.forEach(g=>{span+=g.cols.length+1;g._cat=ci;});
     h+='<th class="cat cc cat'+ci+' gsep" colspan="'+span+'" style="background:'+(CAT_BG[c.name]||'#2e7d32')+'">'+c.name+'</th>';
   });
   h+='</tr><tr>';
   CAT.forEach(c=>{c.langs.forEach(g=>{
     h+='<th class="lang cc cat'+g._cat+' gsep" colspan="'+(g.cols.length+1)+'">'+g.name+'</th>';
   });});
   h+='</tr><tr>';
   use.forEach(g=>{g.cols.forEach((ci,k)=>{h+='<th class="sub cc cat'+g._cat+(k===0?' gsep':'')+'">'+(clean(sub[ci])||'')+'</th>';});h+='<th class="sub cc cat'+g._cat+'">🔊</th>';});
   h+='</tr></thead><tbody>';
   data.forEach((r,ri)=>{
     if(!r.some(c=>clean(c)))return;
     const zh=use.length?clean(r[use[0].cols[0]]):'';
     if(!zh)return;
     h+='<tr><td class="first imgcol"><span class="thumb" data-topic="'+TOPIC+'" data-word="'+zh.replace(/"/g,'&quot;')+'" data-i="'+ri+'"></span></td>';
     use.forEach(g=>{
       const isKana=s=>/[぀-ヿ]/.test(s);
       let speak=clean(r[g.cols[0]]);
       if(g.name==='日文'){
         const kanaCol=g.cols.find(c=>isKana(clean(r[c])));
         const romCol=g.cols.find(c=>/羅馬/.test(clean(sub[c])));
         speak = kanaCol!=null ? clean(r[kanaCol]) : (romCol!=null ? clean(r[romCol]) : speak);
       }
       const phon=g.cols.map(c=>clean(r[c])).filter(Boolean).slice(1).join(' · ');
       const isTC=(g===use[0]);
       g.cols.forEach((ci,k)=>{
         const txt=clean(r[ci]);
         const cell = k===0
           ? '<span class="word">'+txt.replace(/</g,'&lt;')+'</span>'
           : '<span class="phon">'+txt.replace(/</g,'&lt;')+'</span>';
         h+='<td class="group cc cat'+g._cat+(k===0?' gsep':'')+(isTC&&k===0?' zcol':'')+'">'+cell+'</td>';
       });
       // 錄音單獨一格
       h+='<td class="group cc cat'+g._cat+'">';
       if(/^(繁體中文|簡體中文|台語|客語|美式英文|英式英文|日文|韓文)$/.test(g.name))
         h+='<button class="spk" data-name="'+g.name+'" data-text="'+speak.replace(/"/g,'&quot;')+'" data-phon="'+(phon||'').replace(/"/g,'&quot;')+'" onclick="spk(this)">\u{1F50A}</button>';
       h+='</td>';
     });
     h+='</tr>';
   });
   h+='</tbody>';
   box.innerHTML='<div class="tablewrap"><table>'+h+'</table></div>';
   // 右上角：語言切換（繁體中文固定不動；其他分兩類切換）
   const bar=document.getElementById('catbar');
   if(bar){
     let b='<span>顯示</span>';
     CAT.forEach((c,ci)=>{if(ci===0)return;
       b+='<button data-m="cat'+ci+'">'+c.name+'</button>';});
     b+='<button data-m="all">全部</button>';
     bar.innerHTML=b;
     bar.querySelectorAll('button').forEach(bt=>{bt.onclick=function(){setMode(bt.getAttribute('data-m'));};});
     let m='cat1';
     try{m=localStorage.getItem('langmode')||'cat1';}catch(e){}
     if(m!=='all'&&!CAT[parseInt(String(m).slice(3),10)])m='cat1';
     setMode(m);
   }
   fillMedia();
   setTimeout(()=>{document.querySelectorAll('.spk').forEach(b=>{const m=VOICE_MAP[b.getAttribute('data-name')];if(m&&!hasVoice(m.lang)&&!m.fallback)b.classList.add('no');});},400);
 }).catch(e=>{box.innerHTML='<div class="status err">讀取失敗：'+e.message+'（此表可能未公開分享）</div>';});
</script></body></html>
