<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科目｜多語言對照表</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;background:#eff8f1;color:#1f3d2b;padding:16px}
a{text-decoration:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:26px;text-align:center;margin:10px 0 4px;color:#1f6b3a}
.sub{text-align:center;color:#6b8a77;font-size:13px;margin-bottom:18px}
h2{font-size:16px;color:#2e7d32;margin:22px 0 10px;padding-left:10px;border-left:5px solid #43a047}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:14px 12px;box-shadow:0 2px 6px rgba(30,90,50,.10);
      transition:transform .12s,box-shadow .12s;display:block;text-align:center;border:1px solid #e2f0e6}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(30,90,50,.20);border-color:#a5d6a7}
.card .ico{font-size:34px;line-height:1;margin-bottom:8px}
.card .n{font-size:16px;font-weight:600;color:#20503a}
.card .c{font-size:11px;color:#8aa79a;margin-top:5px}
.back{display:inline-block;margin-bottom:12px;color:#2e7d32;font-size:14px}
.tablewrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(30,90,50,.12);overflow:auto;max-height:80vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th{background:#2e7d32;color:#fff;padding:10px 16px;font-size:13px;position:sticky;top:0;z-index:2;white-space:nowrap}
th.sub{background:#66bb6a;font-size:11px;font-weight:400;top:38px;z-index:2}
td{padding:8px 16px;border-bottom:1px solid #eaf4ec;text-align:center;vertical-align:middle;background:#fff;white-space:nowrap}
tr:nth-child(even) td{background:#f7fcf8}
td.group{border-right:1px solid #edf7ef}
/* 語言之間的粗分隔線 */
.gsep{border-left:3px solid #a5d6a7!important}
th.gsep{border-left:3px solid #14532d!important}
td.first{border-right:3px solid #a5d6a7}
/* 凍結：左邊第一欄（圖片＋詞）不動 */
td.first,th:first-child{position:sticky;left:0;padding-left:10px;padding-right:10px;box-shadow:2px 0 5px rgba(30,90,50,.08)}
td.first{background:#e8f5e9!important;font-weight:600;min-width:104px;z-index:1}
thead th:first-child{z-index:4;background:#2e7d32;color:#fff;text-align:center}
/* 圖片欄（凍結） */
.imgcol{width:100px;min-width:100px;padding:4px!important}
.thumb{display:inline-flex;align-items:center;justify-content:center;width:86px;height:86px;
       background:#f4faf5;border-radius:10px;border:1px dashed #cde3d3;overflow:hidden}
.thumb.has{border:none;background:transparent}
.thumb img{width:86px;height:86px;object-fit:contain;display:block;background:transparent}
.phon{color:#7f9c8b;font-size:12px;display:block;white-space:nowrap}
.word{white-space:nowrap}
.spk{border:none;background:#43a047;color:#fff;width:24px;height:24px;border-radius:50%;
     cursor:pointer;font-size:11px;margin-left:4px;vertical-align:middle}
.spk:hover{background:#2e7d32}
.spk.playing{background:#ef6c00}
.spk.no{-webkit-filter:grayscale(1);opacity:.45}
.status{text-align:center;padding:30px;color:#8aa79a}
.err{color:#c62828}
.note{font-size:12px;color:#8aa79a;margin:10px 4px}
</style></head>
<body><div class="wrap"><a class="back" href="../index.html">← 回多語言對照表</a><h1>📚 科目</h1><div class="sub">點 🔊 聽發音 · 台語／客語若系統沒有語音會用拼音朗讀 · 表格可上下左右翻，語言列跟左邊圖片會固定</div><div id="box"><div class="status">載入中…</div></div><div class="note">資料來源：原本的 Google 試算表（即時讀取）</div></div><script>
const VOICE_MAP={
 '繁體中文':{lang:'zh-TW'},'簡體中文':{lang:'zh-CN'},
 '台語':{lang:'nan-TW',fallback:'zh-TW',usePhon:1},
 '客語':{lang:'hak-TW',fallback:'zh-TW',usePhon:1},
 '美式英文':{lang:'en-US'},'英式英文':{lang:'en-GB'},
 '日文':{lang:'ja-JP'},'韓文':{lang:'ko-KR'}
};
let voices=[];function lv(){voices=speechSynthesis.getVoices();}
speechSynthesis.onvoiceschanged=lv;lv();
function hasVoice(l){return voices.some(v=>v.lang.toLowerCase().startsWith(l.split('-')[0].toLowerCase()));}
function spk(btn){
  const nm=btn.getAttribute('data-name'),txt=btn.getAttribute('data-text'),ph=btn.getAttribute('data-phon');
  const cfg=VOICE_MAP[nm];if(!cfg||!txt)return;
  let lang=cfg.lang,t=txt;
  if(!hasVoice(cfg.lang)&&cfg.fallback){lang=cfg.fallback;if(cfg.usePhon&&ph)t=ph;}
  const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.85;
  speechSynthesis.cancel();speechSynthesis.speak(u);
  document.querySelectorAll('.spk.playing').forEach(b=>b.classList.remove('playing'));
  btn.classList.add('playing');setTimeout(()=>btn.classList.remove('playing'),1500);
}

const SHEET='1ud_WbGVW8klA8ZJep27RMuyhYexB81emBlVDANQVuwk',TOPIC='科目';
const IMGBASE='../img/';
const box=document.getElementById('box');
// 把已生成的去背圖片填進「圖片」欄（沒有圖就先留空框）
fetch(IMGBASE+'manifest.json').then(r=>r.ok?r.json():{}).catch(()=>({})).then(man=>{
  const m=(man&&man[TOPIC])||{};
  document.querySelectorAll('.thumb').forEach(el=>{
    const w=el.getAttribute('data-word'),i=el.getAttribute('data-i');
    const src=m[w]||m['#'+i];
    if(src){el.classList.add('has');el.innerHTML='<img loading="lazy" src="'+IMGBASE+src+'" alt="'+w+'">';}
  });
});
function clean(v){return v==null?'':String(v).replace(/\r/g,'').split('\n')[0].trim();}
function cleanFull(v){return v==null?'':String(v).replace(/\r/g,'');}
fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:json')
 .then(r=>r.text()).then(t=>{
   const j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
   const tb=j.table;
   const raw=tb.rows.map(r=>r.c.map(c=>c?(c.f!=null?String(c.f):(c.v==null?'':String(c.v))):''));
   const hdr=raw[0]||[],sub=raw[1]||[],data=raw.slice(2);
   // 依 row0 非空切出語言群組
   const groups=[];let cur=null;
   hdr.forEach((v,i)=>{if(clean(v)){cur={name:clean(v),start:i,cols:[]};groups.push(cur);} if(cur)cur.cols.push(i);});
   // 只留真正的語言群組：把「圖示」拿掉、每組最多 3 欄、全空的組丢掉
   const LANG=groups.filter(g=>g.name!=='圖示');
   LANG.forEach((g,k)=>{
     const next=LANG[k+1];
     const end=Math.min(next?next.start:hdr.length, g.start+3);
     g.cols=[];for(let i=g.start;i<end;i++)g.cols.push(i);
   });
   const use=LANG.filter(g=>g.cols.some(c=>clean(sub[c])||data.some(r=>clean(r[c]))));
   const first=groups.length?groups[0]:null;   // 第一欄 = 圖示欄
   const iconCol=(first&&clean(hdr[first.start])==='圖示')?first.start:0;
   let h='<thead><tr><th class="imgcol" rowspan="2">圖片</th>';
   use.forEach(g=>{h+='<th class="gsep" colspan="'+(g.cols.length+1)+'">'+g.name+'</th>';});
   h+='</tr><tr>';
   use.forEach(g=>{g.cols.forEach((ci,k)=>{h+='<th class="sub'+(k===0?' gsep':'')+'">'+(clean(sub[ci])||'')+'</th>';});h+='<th class="sub">🔊</th>';});
   h+='</tr></thead><tbody>';
   data.forEach((r,ri)=>{
     if(!r.some(c=>clean(c)))return;
     const zh=use.length?clean(r[use[0].cols[0]]):'';
     if(!zh)return;
     h+='<tr><td class="first imgcol"><span class="thumb" data-topic="'+TOPIC+'" data-word="'+zh.replace(/"/g,'&quot;')+'" data-i="'+ri+'"></span></td>';
     use.forEach(g=>{
       const isKana=s=>/[぀-ヿ]/.test(s);
       let speak=clean(r[g.cols[0]]);
       if(g.name==='日文'){
         const kanaCol=g.cols.find(c=>isKana(clean(r[c])));
         const romCol=g.cols.find(c=>/羅馬/.test(clean(sub[c])));
         speak = kanaCol!=null ? clean(r[kanaCol]) : (romCol!=null ? clean(r[romCol]) : speak);
       }
       const phon=g.cols.map(c=>clean(r[c])).filter(Boolean).slice(1).join(' · ');
       g.cols.forEach((ci,k)=>{
         const txt=clean(r[ci]);
         const cell = k===0
           ? '<span class="word">'+txt.replace(/</g,'&lt;')+'</span>'
           : '<span class="phon">'+txt.replace(/</g,'&lt;')+'</span>';
         h+='<td class="group'+(k===0?' gsep':'')+'">'+cell+'</td>';
       });
       // 錄音單獨一格
       h+='<td class="group">';
       if(/^(繁體中文|簡體中文|台語|客語|美式英文|英式英文|日文|韓文)$/.test(g.name))
         h+='<button class="spk" data-name="'+g.name+'" data-text="'+speak.replace(/"/g,'&quot;')+'" data-phon="'+(phon||'').replace(/"/g,'&quot;')+'" onclick="spk(this)">\u{1F50A}</button>';
       h+='</td>';
     });
     h+='</tr>';
   });
   h+='</tbody>';
   box.innerHTML='<div class="tablewrap"><table>'+h+'</table></div>';
   setTimeout(()=>{document.querySelectorAll('.spk').forEach(b=>{const m=VOICE_MAP[b.getAttribute('data-name')];if(m&&!hasVoice(m.lang)&&!m.fallback)b.classList.add('no');});},400);
 }).catch(e=>{box.innerHTML='<div class="status err">讀取失敗：'+e.message+'（此表可能未公開分享）</div>';});
</script></body></html>
